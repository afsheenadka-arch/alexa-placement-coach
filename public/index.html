<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexa Placement Coach</title>
<style>
  :root { --bg:#0b2545; --panel:#13315c; --ring:#00caff; --text:#e8f1fa; --muted:#9db3c8; --mine:#1f4e8c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:"Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; }
  header { text-align:center; padding:28px 16px 8px; }
  h1 { margin:0; font-size:1.5rem; font-weight:600; }
  header p { margin:6px 0 0; color:var(--muted); }
  .ring { width:96px; height:96px; margin:18px auto 6px; border-radius:50%; border:8px solid var(--ring);
          box-shadow:0 0 24px rgba(0,202,255,.55), inset 0 0 16px rgba(0,202,255,.35); transition:transform .3s; }
  .ring.live { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); box-shadow:0 0 42px rgba(0,202,255,.9), inset 0 0 22px rgba(0,202,255,.5); } }
  @media (prefers-reduced-motion: reduce) { .ring.live { animation:none; } }
  main { width:100%; max-width:640px; flex:1; display:flex; flex-direction:column; padding:0 16px 16px; }
  #chat { flex:1; min-height:220px; max-height:46vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.45; white-space:pre-wrap; }
  .bot { background:var(--panel); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--mine); align-self:flex-end; border-bottom-right-radius:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chips button { background:transparent; color:var(--text); border:1px solid var(--ring); border-radius:999px; padding:7px 14px; cursor:pointer; font:inherit; }
  .chips button:hover { background:rgba(0,202,255,.15); }
  .bar { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--panel); background:var(--panel); color:var(--text); font:inherit; }
  .bar button { padding:0 16px; border:0; border-radius:12px; background:var(--ring); color:#06223d; font-weight:600; cursor:pointer; font:inherit; }
  :focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<header>
  <h1>Alexa Placement Coach</h1>
  <p>Your voice study partner for placement prep</p>
  <div class="ring" id="ring" aria-hidden="true"></div>
</header>
<main>
  <div id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input id="input" placeholder="Say or type a command" autocomplete="off" aria-label="Command">
    <button id="mic" title="Speak" aria-label="Speak">Mic</button>
    <button id="send">Send</button>
  </div>
</main>
<script>
const chat = document.getElementById("chat"), input = document.getElementById("input"), ring = document.getElementById("ring");
const examples = ["I solved 3 arrays problems", "What should I study tonight?", "Quiz me on arrays", "How did I do this week?"];

function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ". "));
  u.onstart = () => ring.classList.add("live"); u.onend = () => ring.classList.remove("live");
  speechSynthesis.speak(u);
}
async function send(text) {
  text = text.trim(); if (!text) return;
  add(text, "me"); input.value = "";
  try {
    const r = await fetch("/api/command", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ text }) });
    const { reply } = await r.json();
    add(reply, "bot"); speak(reply);
  } catch { add("Could not reach the server. Is it running?", "bot"); }
}
document.getElementById("send").onclick = () => send(input.value);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });

const chips = document.getElementById("chips");
examples.forEach((t) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); chips.appendChild(b); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById("mic");
if (!SR) { mic.disabled = true; mic.title = "Voice input needs Chrome or Edge"; }
else {
  const rec = new SR(); rec.lang = "en-IN";
  rec.onstart = () => ring.classList.add("live"); rec.onend = () => ring.classList.remove("live");
  rec.onresult = (e) => send(e.results[0][0].transcript);
  mic.onclick = () => rec.start();
}
add("Hi, I'm your placement coach. Log your practice, ask for a plan, or take a quick quiz.", "bot");
</script>
</body>
</html>
