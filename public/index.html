<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexa Placement Coach</title>
<style>
  :root { --bg:#0b2545; --panel:#13315c; --panel2:#1b4175; --ring:#00caff; --text:#e8f1fa; --muted:#9db3c8; --mine:#1f4e8c; --good:#5fd38d; --bad:#ffb454; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, sans-serif; line-height:1.45; }
  .app { max-width:720px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; padding:0 14px env(safe-area-inset-bottom, 10px); }
  header { display:flex; align-items:center; gap:14px; padding:16px 0 10px; }
  .ring { flex:none; width:56px; height:56px; border-radius:50%; border:6px solid var(--ring); box-shadow:0 0 18px rgba(0,202,255,.55), inset 0 0 12px rgba(0,202,255,.35); }
  .ring.live { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); box-shadow:0 0 32px rgba(0,202,255,.9), inset 0 0 16px rgba(0,202,255,.5); } }
  .ttl { flex:1; min-width:0; }
  h1 { margin:0; font-size:1.25rem; font-weight:600; }
  .ttl p { margin:2px 0 0; color:var(--muted); font-size:.9rem; }
  button { font:inherit; color:inherit; cursor:pointer; min-height:44px; }
  .ghost { background:transparent; border:1px solid var(--muted); border-radius:999px; padding:0 14px; color:var(--muted); }
  #chat { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px 10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bot { background:var(--panel); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--mine); align-self:flex-end; border-bottom-right-radius:4px; }
  .error { border:1px solid var(--bad); }
  .thinking::after { content:"…"; display:inline-block; animation:dots 1s steps(3,end) infinite; width:1em; overflow:hidden; vertical-align:bottom; }
  @keyframes dots { from { width:0; } to { width:1em; } }
  .tool { align-self:flex-start; font-family:Consolas, monospace; font-size:.78rem; color:var(--ring); padding:0 4px; overflow-wrap:anywhere; }
  .card { align-self:stretch; background:var(--panel); border:1px solid var(--panel2); border-radius:16px; padding:14px; }
  .eyebrow { color:var(--ring); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
  .big { font-size:1.6rem; font-weight:600; text-transform:capitalize; }
  .card p { margin:8px 0 10px; color:var(--text); }
  .qtext { font-size:1.05rem; margin-bottom:10px; }
  .opts { display:flex; flex-direction:column; gap:8px; }
  .opt { display:flex; align-items:center; gap:10px; text-align:left; background:var(--panel2); border:1px solid transparent; border-radius:12px; padding:8px 12px; }
  .opt:hover:not(:disabled) { border-color:var(--ring); }
  .opt:disabled { cursor:default; opacity:.7; }
  .opt.picked { border-color:var(--ring); opacity:1; }
  .key { flex:none; width:28px; height:28px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-weight:600; color:var(--ring); }
  .stats { display:flex; gap:22px; margin-bottom:10px; }
  .stats b { display:block; font-size:1.7rem; line-height:1.1; }
  .stats span { color:var(--muted); font-size:.85rem; }
  .barrow { display:grid; grid-template-columns:96px 1fr 28px; align-items:center; gap:8px; margin:6px 0; font-size:.9rem; }
  .track { height:10px; background:var(--bg); border-radius:999px; overflow:hidden; }
  .fill { height:100%; background:var(--ring); border-radius:999px; }
  .res { margin:4px 0; }
  .ok { color:var(--good); } .no { color:var(--bad); }
  .btn { background:var(--ring); color:#06223d; border:0; border-radius:12px; padding:0 16px; font-weight:600; margin:4px 8px 0 0; }
  details { margin:0 0 6px; color:var(--muted); font-size:.85rem; }
  summary { cursor:pointer; padding:6px 0; }
  #log { max-height:24vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .entry { background:var(--panel); border-radius:8px; padding:6px 8px; font-family:Consolas, monospace; font-size:.75rem; overflow-wrap:anywhere; }
  .entry b { color:var(--ring); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 8px; }
  .chips span { flex:none; align-self:center; color:var(--muted); font-size:.85rem; }
  .chips button { flex:none; background:transparent; border:1px solid var(--ring); border-radius:999px; padding:0 14px; }
  .chips button:hover { background:rgba(0,202,255,.15); }
  .bar { display:flex; gap:8px; padding-bottom:10px; }
  input { flex:1; min-width:0; min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--panel2); background:var(--panel); color:var(--text); font:inherit; font-size:16px; }
  .bar button { padding:0 16px; border:0; border-radius:12px; background:var(--panel2); }
  #send { background:var(--ring); color:#06223d; font-weight:600; }
  #mic.on { background:var(--bad); color:#06223d; }
  .shell { display:block; }
  .side { display:none; }
  .coach { width:150px; height:150px; filter:drop-shadow(0 0 14px rgba(0,202,255,.6)); animation:float 3.2s ease-in-out infinite; }
  .coach.talk { animation-duration:.8s; }
  @keyframes float { 50% { transform:translateY(-10px); } }
  .eye { transform-box:fill-box; transform-origin:center; animation:blink 4s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
  .coachname { color:var(--muted); font-size:.85rem; }
  .bubble { position:relative; background:var(--panel); border:1px solid var(--panel2); border-radius:16px; padding:14px 16px; width:100%; max-width:260px; min-height:92px; display:grid; place-items:center; text-align:center; transition:opacity .4s; }
  .bubble.fade { opacity:0; }
  .bubble::before { content:""; position:absolute; top:-8px; left:50%; margin-left:-7px; width:14px; height:14px; background:var(--panel); border-left:1px solid var(--panel2); border-top:1px solid var(--panel2); transform:rotate(45deg); }
  .panel { background:var(--panel); border:1px solid var(--panel2); border-radius:16px; padding:14px; width:100%; max-width:260px; }
  .panel h2 { margin:0 0 10px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ring); font-weight:400; }
  .panel p { margin:0; color:var(--muted); font-size:.9rem; }
  .topics { display:flex; flex-wrap:wrap; gap:8px; }
  .topics button { background:var(--panel2); border:1px solid transparent; border-radius:999px; padding:0 12px; min-height:36px; text-transform:capitalize; }
  .topics button:hover { border-color:var(--ring); }
  @media (min-width:1100px) {
    .shell { display:grid; grid-template-columns:1fr minmax(0,720px) 1fr; gap:24px; height:100vh; height:100dvh; padding:0 24px; }
    .side { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px 0; }
  }
  :focus-visible { outline:3px solid #fff; outline-offset:2px; }
  @media (max-width:520px) { .chips { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; } .ttl p { display:none; } .barrow { grid-template-columns:80px 1fr 26px; } }
  @media (prefers-reduced-motion: reduce) { .ring.live, .thinking::after, .coach, .eye { animation:none; } }
</style>
</head>
<body>
<div class="shell">
<aside class="side" aria-label="Your coach">
  <svg class="coach" id="coach" viewBox="0 0 160 160" aria-hidden="true">
    <circle cx="80" cy="80" r="62" fill="#13315c" stroke="#00caff" stroke-width="9"/>
    <ellipse class="eye" cx="60" cy="72" rx="7" ry="9" fill="#e8f1fa"/>
    <ellipse class="eye" cx="100" cy="72" rx="7" ry="9" fill="#e8f1fa"/>
    <path d="M58 100 Q80 118 102 100" fill="none" stroke="#00caff" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <div class="coachname">Your coach</div>
  <div class="bubble" id="slogan"></div>
</aside>
<div class="app">
  <header>
    <div class="ring" id="ring" aria-hidden="true"></div>
    <div class="ttl"><h1>Alexa Placement Coach</h1><p>Your voice study partner for placement prep</p></div>
    <button id="mute" class="ghost" aria-pressed="false">Voice on</button>
  </header>
  <div id="chat" aria-live="polite"></div>
  <details id="activity"><summary>MCP activity (<span id="count">0</span> tool calls)</summary><div id="log"></div></details>
  <div class="chips" id="chips"><span>Try:</span></div>
  <div class="bar">
    <input id="input" placeholder="Type or tap Mic and speak" autocomplete="off" aria-label="Command">
    <button id="mic" aria-label="Speak a command">Mic</button>
    <button id="send">Send</button>
  </div>
</div>
<aside class="side" aria-label="Shortcuts">
  <div class="panel"><h2>Quiz a topic</h2><div class="topics" id="topics"></div></div>
  <div class="panel"><h2>Try saying</h2><p>“I solved 3 trees problems”<br>“What should I study tonight?”<br>“How did I do this week?”</p></div>
</aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), ring = $("ring"), micBtn = $("mic"), muteBtn = $("mute");
const TOPICS = ["linked lists", "arrays", "strings", "sorting", "trees", "graphs", "dp"];
const EXAMPLES = ["I solved 3 arrays problems", "What should I study tonight?", "Quiz me on arrays", "How did I do this week?"];
let muted = false, rpcId = 1, quiz = null, calls = 0;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll() { chat.scrollTop = chat.scrollHeight; }
function add(text, who) { const d = el("div", "msg " + who, text); chat.appendChild(d); scroll(); return d; }
function addCard(node) { node.classList.add("card"); chat.appendChild(node); scroll(); }
function speak(text) {
  if (muted || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ". "));
  u.onstart = () => { ring.classList.add("live"); $("coach").classList.add("talk"); };
  u.onend = () => { ring.classList.remove("live"); $("coach").classList.remove("talk"); };
  speechSynthesis.speak(u);
}
function say(text) { add(text, "bot"); speak(text); }
function fail(e) {
  console.error(e);
  add("I can't reach my tools right now. Make sure the server is running (npm start in your project folder), then refresh the page.", "bot error");
}
muteBtn.onclick = () => {
  muted = !muted; muteBtn.textContent = muted ? "Voice off" : "Voice on"; muteBtn.setAttribute("aria-pressed", String(muted));
  if (muted && "speechSynthesis" in window) { speechSynthesis.cancel(); ring.classList.remove("live"); }
};

// ---- MCP: call one tool over Streamable HTTP (JSON-RPC tools/call) ----
function logActivity(name, args, out) {
  $("count").textContent = ++calls;
  const e = el("div", "entry"); e.appendChild(el("b", "", name));
  e.appendChild(document.createTextNode(" " + JSON.stringify(args) + " -> " + out.replace(/\n/g, " / ").slice(0, 220)));
  const log = $("log"); log.prepend(e); while (log.children.length > 20) log.lastChild.remove();
}
async function callTool(name, args) {
  const r = await fetch("/mcp", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: rpcId++, method: "tools/call", params: { name, arguments: args } }),
  });
  const data = await r.json();
  if (data.error) throw new Error(data.error.message);
  const out = data.result.content.map((c) => c.text).join("\n");
  logActivity(name, args, out);
  return out;
}
async function useTool(name, args) {
  chat.appendChild(el("div", "tool", "MCP tool call: " + name + " " + JSON.stringify(args)));
  const t = add("Coach is thinking", "bot thinking");
  try { return await callTool(name, args); } finally { t.remove(); }
}

// ---- Cards ----
function planCard(text) {
  const m = text.match(/solve \d+ ([a-z ]+?) problems/i);
  if (!m) return say(text);
  const topic = m[1], c = el("div");
  c.appendChild(el("div", "eyebrow", "Tonight's focus")); c.appendChild(el("div", "big", topic)); c.appendChild(el("p", "", text));
  const b = el("button", "btn", "Quiz me on " + topic); b.onclick = () => send("quiz me on " + topic); c.appendChild(b);
  addCard(c); speak(text);
}
function summaryCard(text) {
  const m = text.match(/solved (\d+) problems? across (\d+) day/);
  if (!m) return say(text);
  const rest = text.slice(text.indexOf(". ", text.indexOf("across")) + 2).replace(/\.$/, "");
  const items = rest.split(", ").map((s) => s.split(": ")).filter((p) => p.length === 2).map(([t, n]) => [t, +n]);
  const max = Math.max(1, ...items.map((i) => i[1])), c = el("div");
  c.appendChild(el("div", "eyebrow", "Your week"));
  const stats = el("div", "stats");
  [[m[1], "problems solved"], [m[2], "active days"]].forEach(([n, l]) => { const d = el("div"); d.appendChild(el("b", "", n)); d.appendChild(el("span", "", l)); stats.appendChild(d); });
  c.appendChild(stats);
  items.forEach(([t, n]) => {
    const row = el("div", "barrow"), tr = el("div", "track"), f = el("div", "fill");
    f.style.width = Math.round((n / max) * 100) + "%"; tr.appendChild(f);
    row.appendChild(el("span", "", t)); row.appendChild(tr); row.appendChild(el("span", "", String(n))); c.appendChild(row);
  });
  addCard(c); speak("This week you solved " + m[1] + " problems across " + m[2] + " days.");
}

// ---- Quiz: one card per question, buttons A/B/C ----
function parseQuiz(out) {
  return out.split("\n\n").map((b) => { const L = b.split("\n"); return { q: L[0].replace(/^Q\d+:\s*/, ""), opts: L.slice(1).map((x) => x.replace(/^[A-C]\)\s*/, "")) }; });
}
function showQuestion() {
  const q = quiz.qs[quiz.i], c = el("div");
  c.appendChild(el("div", "eyebrow", quiz.topic + " quiz · Question " + (quiz.i + 1) + " of " + quiz.qs.length));
  c.appendChild(el("div", "qtext", q.q));
  const row = el("div", "opts");
  q.opts.forEach((o, k) => {
    const b = el("button", "opt"); b.appendChild(el("span", "key", "ABC"[k])); b.appendChild(document.createTextNode(o));
    b.onclick = () => answerQuiz("abc"[k]); row.appendChild(b);
  });
  c.appendChild(row); addCard(c); quiz.card = c;
  speak(q.q + ". A, " + q.opts[0] + ". B, " + q.opts[1] + ". C, " + q.opts[2] + ".");
}
async function answerQuiz(letter) {
  if (!quiz || quiz.busy) return;
  quiz.busy = true;
  quiz.card.querySelectorAll("button").forEach((b, k) => { b.disabled = true; if ("abc"[k] === letter) b.classList.add("picked"); });
  quiz.answers.push(letter); quiz.i++;
  if (quiz.i < quiz.qs.length) { quiz.busy = false; return showQuestion(); }
  const q = quiz;
  try { scoreCard(await useTool("grade_quiz", { topic: q.topic, answers: q.answers })); }
  catch (e) { fail(e); }
  finally { quiz = null; }
}
function scoreCard(out) {
  const m = out.match(/Score: (\d+) out of (\d+)/);
  if (!m) return say(out);
  const c = el("div");
  c.appendChild(el("div", "eyebrow", "Quiz result")); c.appendChild(el("div", "big", m[1] + " / " + m[2]));
  out.split("\n").slice(1).forEach((l) => { const ok = l.includes("correct") && !l.includes("wrong"); c.appendChild(el("div", "res " + (ok ? "ok" : "no"), (ok ? "✓ " : "✗ ") + l)); });
  const b = el("button", "btn", "What should I study next?"); b.onclick = () => send("What should I study tonight?"); c.appendChild(b);
  addCard(c); speak("You scored " + m[1] + " out of " + m[2] + ".");
}

// ---- Simple "brain": sentence -> tool name + arguments ----
function intent(s) {
  const topic = TOPICS.find((t) => s.includes(t));
  if (s.includes("quiz")) return topic ? { tool: "start_quiz", args: { topic } } : { say: "Which topic? Try: quiz me on arrays, strings, sorting, linked lists, trees, graphs, or dp." };
  if (/summary|weekly|how did i do/.test(s)) return { tool: "get_weekly_summary", args: {} };
  if (/plan|what should i/.test(s)) return { tool: "get_study_plan", args: {} };
  if (/solved|did|completed|log/.test(s)) {
    const m = s.match(/(\d+)/), count = Math.min(50, Math.max(1, m ? parseInt(m[1], 10) : 1));
    return { tool: "log_progress", args: { topic: topic || "general", count } };
  }
  return { say: "I can log your progress, plan tonight's study, quiz you, or summarize your week." };
}
async function send(text) {
  text = text.trim(); if (!text) return;
  add(text, "me"); input.value = "";
  const s = text.toLowerCase(), letter = s.replace(/[^a-z]/g, "");
  if (quiz && /^[abc]$/.test(letter)) return answerQuiz(letter);
  const it = intent(s);
  if (it.say) return say(it.say);
  try {
    const out = await useTool(it.tool, it.args);
    if (it.tool === "get_study_plan") return planCard(out);
    if (it.tool === "get_weekly_summary") return summaryCard(out);
    if (it.tool === "start_quiz") {
      if (!out.startsWith("Q1")) return say(out);
      quiz = { topic: it.args.topic, qs: parseQuiz(out), i: 0, answers: [], card: null, busy: false };
      add("Let's go. " + quiz.qs.length + " questions on " + quiz.topic + ".", "bot");
      return showQuestion();
    }
    say(out);
  } catch (e) { fail(e); }
}

// ---- Input wiring: send button, Enter, example chips, mic ----
$("send").onclick = () => send(input.value);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });
EXAMPLES.forEach((t) => { const b = el("button", "", t); b.onclick = () => send(t); $("chips").appendChild(b); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { micBtn.disabled = true; micBtn.title = "Voice input needs Chrome or Edge"; }
else {
  const rec = new SR(); rec.lang = "en-IN";
  rec.onstart = () => { ring.classList.add("live"); micBtn.classList.add("on"); micBtn.textContent = "Listening…"; };
  rec.onend = () => { ring.classList.remove("live"); micBtn.classList.remove("on"); micBtn.textContent = "Mic"; };
  rec.onerror = (e) => add("I couldn't hear that (" + e.error + "). Check microphone permission and try again.", "bot error");
  rec.onresult = (e) => send(e.results[0][0].transcript);
  micBtn.onclick = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); try { rec.start(); } catch (e) {} };
}

// ---- Side panels: rotating motivation and topic shortcuts (wide screens) ----
const SLOGANS = ["Consistency beats intensity. One problem a day adds up.", "Every expert was once stuck on arrays.", "Small steps today, big offers tomorrow.", "Debugging is just learning in disguise.", "Today's practice is tomorrow's confidence.", "You don't need to be perfect. You need to be consistent.", "Solve one more problem than yesterday.", "Mistakes are proof that you're trying.", "Placements are a marathon. Pace yourself."];
let si = 0; const slogan = $("slogan"); slogan.textContent = SLOGANS[0];
setInterval(() => { slogan.classList.add("fade"); setTimeout(() => { si = (si + 1) % SLOGANS.length; slogan.textContent = SLOGANS[si]; slogan.classList.remove("fade"); }, 400); }, 7000);
TOPICS.forEach((t) => { const b =el("button", "", t === "dp" ? "DP" : t); b.onclick = () => send("quiz me on " + t); $("topics").appendChild(b); });

// ---- Welcome back: read the weekly summary through MCP on load ----
(async function boot() {
  add("Hi, I'm your placement coach. Log practice, get a plan, take a quiz, or check your week. Tap an example below to start.", "bot");
  try {
    const out = await useTool("get_weekly_summary", {});
    if (/solved \d+ problems?/.test(out)) { add("Welcome back! Here's your week so far.", "bot"); summaryCard(out); }
    else add("No problems logged this week yet. Try: I solved 3 arrays problems.", "bot");
  } catch (e) { fail(e); }
})();
</script>
</body>
</html>
