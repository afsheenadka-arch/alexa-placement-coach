<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexa Placement Coach</title>
<style>
  :root { --bg:#0b2545; --panel:#13315c; --ring:#00caff; --text:#e8f1fa; --muted:#9db3c8; --mine:#1f4e8c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:"Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; }
  header { text-align:center; padding:28px 16px 8px; }
  h1 { margin:0; font-size:1.5rem; font-weight:600; }
  header p { margin:6px 0 0; color:var(--muted); }
  .ring { width:96px; height:96px; margin:18px auto 6px; border-radius:50%; border:8px solid var(--ring);
          box-shadow:0 0 24px rgba(0,202,255,.55), inset 0 0 16px rgba(0,202,255,.35); transition:transform .3s; }
  .ring.live { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); box-shadow:0 0 42px rgba(0,202,255,.9), inset 0 0 22px rgba(0,202,255,.5); } }
  @media (prefers-reduced-motion: reduce) { .ring.live { animation:none; } }
  main { width:100%; max-width:640px; flex:1; display:flex; flex-direction:column; padding:0 16px 16px; }
  #chat { flex:1; min-height:220px; max-height:46vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.45; white-space:pre-wrap; }
  .bot { background:var(--panel); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--mine); align-self:flex-end; border-bottom-right-radius:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chips button { background:transparent; color:var(--text); border:1px solid var(--ring); border-radius:999px; padding:7px 14px; cursor:pointer; font:inherit; }
  .chips button:hover { background:rgba(0,202,255,.15); }
  .bar { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--panel); background:var(--panel); color:var(--text); font:inherit; }
  .bar button { padding:0 16px; border:0; border-radius:12px; background:var(--ring); color:#06223d; font-weight:600; cursor:pointer; font:inherit; }
  .tool { align-self:flex-start; font-family:Consolas, monospace; font-size:.8rem; color:var(--ring); padding:2px 4px; }
  :focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<header>
  <h1>Alexa Placement Coach</h1>
  <p>Your voice study partner for placement prep</p>
  <div class="ring" id="ring" aria-hidden="true"></div>
</header>
<main>
  <div id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="bar">
    <input id="input" placeholder="Say or type a command" autocomplete="off" aria-label="Command">
    <button id="mic" title="Speak" aria-label="Speak">Mic</button>
    <button id="send">Send</button>
  </div>
</main>
<script>
const chat = document.getElementById("chat"), input = document.getElementById("input"), ring = document.getElementById("ring");
const examples = ["I solved 3 arrays problems", "What should I study tonight?", "Quiz me on arrays", "How did I do this week?"];

function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ". "));
  u.onstart = () => ring.classList.add("live"); u.onend = () => ring.classList.remove("live");
  speechSynthesis.speak(u);
}
const TOPICS = ["linked lists", "arrays", "strings", "sorting", "trees", "graphs", "dp"];
let rpcId = 1, quiz = null;

// Call one MCP tool on the server (JSON-RPC "tools/call" over Streamable HTTP)
async function callTool(name, args) {
  const r = await fetch("/mcp", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: rpcId++, method: "tools/call", params: { name, arguments: args } }),
  });
  const data = await r.json();
  if (data.error) throw new Error(data.error.message);
  return data.result.content.map((c) => c.text).join("\n");
}
async function useTool(name, args) {
  const d = document.createElement("div");
  d.className = "tool"; d.textContent = "MCP tool call: " + name + " " + JSON.stringify(args);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return callTool(name, args);
}
function say(t) { add(t, "bot"); speak(t); }

// Simple "brain": turn a sentence into a tool name and arguments
function intent(s) {
  const topic = TOPICS.find((t) => s.includes(t));
  if (s.includes("quiz")) return topic ? { tool: "start_quiz", args: { topic } } : { say: "Which topic? Try: quiz me on arrays, strings, sorting, linked lists, trees, graphs, or dp." };
  if (/summary|weekly|how did i do/.test(s)) return { tool: "get_weekly_summary", args: {} };
  if (/plan|what should i/.test(s)) return { tool: "get_study_plan", args: {} };
  if (/solved|did|completed|log/.test(s)) {
    const m = s.match(/(\d+)/);
    const count = Math.min(50, Math.max(1, m ? parseInt(m[1], 10) : 1));
    return { tool: "log_progress", args: { topic: topic || "general", count } };
  }
  return { say: "I can log your progress, plan tonight's study, quiz you, or summarize your week." };
}

async function send(text) {
  text = text.trim(); if (!text) return;
  add(text, "me"); input.value = "";
  const s = text.toLowerCase();
  try {
    const letter = s.replace(/[^a-z]/g, "");
    if (quiz && /^[abc]$/.test(letter)) {          // answering a quiz question
      quiz.answers.push(letter); quiz.i++;
      if (quiz.i < quiz.qs.length) return say(quiz.qs[quiz.i]);
      const result = await useTool("grade_quiz", { topic: quiz.topic, answers: quiz.answers });
      quiz = null; return say(result);
    }
    const it = intent(s);
    if (it.say) return say(it.say);
    const out = await useTool(it.tool, it.args);
    if (it.tool === "start_quiz" && out.startsWith("Q1")) {   // ask questions one at a time
      quiz = { topic: it.args.topic, qs: out.split("\n\n"), answers: [], i: 0 };
      return say(quiz.qs[0]);
    }
    say(out);
  } catch (e) { add("Could not reach the MCP server. Is it running? (" + e.message + ")", "bot"); }
}
document.getElementById("send").onclick = () => send(input.value);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(input.value); });

const chips = document.getElementById("chips");
examples.forEach((t) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); chips.appendChild(b); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById("mic");
if (!SR) { mic.disabled = true; mic.title = "Voice input needs Chrome or Edge"; }
else {
  const rec = new SR(); rec.lang = "en-IN";
  rec.onstart = () => ring.classList.add("live"); rec.onend = () => ring.classList.remove("live");
  rec.onresult = (e) => send(e.results[0][0].transcript);
  mic.onclick = () => rec.start();
}
add("Hi, I'm your placement coach. Log your practice, ask for a plan, or take a quick quiz.", "bot");
</script>
</body>
</html>
